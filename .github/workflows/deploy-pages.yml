name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/build_site.py", "md/**", ".github/workflows/deploy-pages.yml"]
  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so chain from the weekly update.
  workflow_run:
    workflows: ["Weekly update SFS (direct to main)"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build site
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
